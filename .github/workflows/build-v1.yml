name: ArchIME v1 clean Android build

on:
  workflow_dispatch:
  push:
    branches: [rewrite/archime-v1-clean]
    paths:
      - 'android-v1/**'
      - '.github/workflows/build-v1.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate original key click sample
        run: python3 android-v1/scripts/generate_key_click.py
      - name: Compile clean v1 project
        run: gradle --no-daemon -p android-v1 :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android-v1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
      - uses: actions/upload-artifact@v4
        with:
          name: ArchIME-v1-foundation-debug
          path: android-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
