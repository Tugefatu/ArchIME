name: ArchIME v1 clean Android build

on:
  workflow_dispatch:
  push:
    branches: [rewrite/archime-v1-clean]
    paths:
      - 'android-v1/**'
      - 'legacy/**'
      - '.github/workflows/build-v1.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned legacy Rime integration source archive
        uses: actions/checkout@v4
        with:
          ref: fix-ime-startup-and-feedback-settings
          path: legacy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Integrate ARM64 Rime and Microsoft Shuangpin
        run: bash android-v1/scripts/integrate_rime_native.sh
      - name: Generate original key click sample
        run: python3 android-v1/scripts/generate_key_click.py
      - name: Compile clean v1 project
        run: gradle --no-daemon -p android-v1 :app:assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android-v1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libarchime_rime.so'
          unzip -l "$APK" | grep -q 'assets/rime/shared/luna_pinyin.dict.yaml'
          unzip -l "$APK" | grep -q 'assets/rime/shared/stroke.dict.yaml'
          unzip -l "$APK" | grep -q 'assets/rime/shared/double_pinyin_mspy.schema.yaml'
          unzip -p "$APK" assets/rime/shared/double_pinyin_mspy.schema.yaml | grep -q 'schema_id: double_pinyin_mspy'
          unzip -p "$APK" assets/rime/shared/double_pinyin_mspy.schema.yaml | grep -q 'dictionary: luna_pinyin'
      - uses: actions/upload-artifact@v4
        with:
          name: ArchIME-v1-rime-debug
          path: android-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
