name: Build ArchIME from zip

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        shell: bash
        run: unzip -q ArchIME-0_7_2-dev-source.zip

      - name: Keep keyboard usable if Rime initialization fails
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ArchIME-0.7.2-dev/app/src/main/java/org/archime/ime/ArchInputMethodService.kt")
          s = p.read_text()
          start = s.index("        if (!isChineseActive())")
          end = s.index("        // Rime schemas", start)
          replacement = """        // Never swallow key presses if the bundled Rime engine cannot initialize.
                  if (!isChineseActive() || !rimeReady) {
                      if (isChineseActive() && !rimeReady) {
                          status.text = "ArchIME · Rime 引擎未就绪，暂用英文输入"
                      }
                      commit(c.toString())
                      return
                  }
          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          print("Patched safe English fallback.")
          PY

      - name: Refresh ArchIME keyboard layout
        shell: bash
        run: python3 patches/refresh_keyboard.py

      - name: Fix IME main-thread Rime freeze
        shell: bash
        run: python3 patches/fix_ime_main_thread_freeze.py

      - name: Build and stage Android ARM64 librime plus Microsoft Shuangpin data
        shell: bash
        run: bash patches/integrate_rime_native.sh

      - name: Verify staged native source and Rime data
        shell: bash
        run: |
          set -euo pipefail
          test -s ArchIME-0.7.2-dev/app/src/main/cpp/CMakeLists.txt
          test -s ArchIME-0.7.2-dev/app/src/main/cpp/archime_bridge.cpp
          for f in default.yaml punctuation.yaml key_bindings.yaml luna_pinyin.dict.yaml stroke.schema.yaml stroke.dict.yaml double_pinyin_mspy.schema.yaml; do
            test -s "ArchIME-0.7.2-dev/app/src/main/assets/rime/shared/$f"
          done
          echo "Native source tree and Microsoft Shuangpin runtime data are staged."

      - name: Inspect and archive unpacked source
        shell: bash
        run: |
          echo "=== Source tree ==="
          find ArchIME-0.7.2-dev/app/src/main -maxdepth 8 -type f -print | sort
          for f in \
            ArchIME-0.7.2-dev/app/src/main/AndroidManifest.xml \
            ArchIME-0.7.2-dev/app/src/main/java/org/archime/ime/ArchInputMethodService.kt \
            ArchIME-0.7.2-dev/app/src/main/java/org/archime/ime/MainActivity.kt \
            ArchIME-0.7.2-dev/app/src/main/res/xml/method.xml; do
            if [ -f "$f" ]; then echo "=== $f ==="; sed -n '1,420p' "$f"; fi
          done

      - name: Upload unpacked Android source
        uses: actions/upload-artifact@v4
        with:
          name: ArchIME-unpacked-source
          path: ArchIME-0.7.2-dev/app/src/main/**
          if-no-files-found: error
          retention-days: 7

      - name: Fix Android InputType constant names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("ArchIME-0.7.2-dev/app/src/main/java/org/archime/ime/ArchInputMethodService.kt")
          s = p.read_text()
          s = re.sub(r"(?<!CLASS_)TYPE_TEXT\b", "TYPE_CLASS_TEXT", s)
          s = re.sub(r"(?<!CLASS_)TYPE_NUMBER\b", "TYPE_CLASS_NUMBER", s)
          p.write_text(s)
          print("Patched Android InputType constants.")
          PY

      - name: Diagnose Gradle source and Maven access
        shell: bash
        run: |
          echo "=== Project files ==="
          find "$GITHUB_WORKSPACE/ArchIME-0.7.2-dev" -maxdepth 3 -type f \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradle.properties' \) -print
          for f in "$GITHUB_WORKSPACE"/ArchIME-0.7.2-dev/settings.gradle* "$GITHUB_WORKSPACE"/ArchIME-0.7.2-dev/build.gradle* "$GITHUB_WORKSPACE"/ArchIME-0.7.2-dev/app/build.gradle*; do
            if [ -f "$f" ]; then echo "=== $f ==="; sed -n '1,240p' "$f"; fi
          done
          echo "=== Maven Central probe ==="
          curl -sSIL --max-time 20 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.pom | head -n 8
          echo "=== Google Maven probe ==="
          curl -sSIL --max-time 20 https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.7.3/gradle-8.7.3.pom | head -n 8

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform, NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Align Java compiler target with Kotlin
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/logs-jvm-compat.gradle" <<'EOF'
          allprojects {
              afterEvaluate {
                  def androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                      androidExtension.compileOptions.targetCompatibility = JavaVersion.VERSION_17
                  }
                  tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                      sourceCompatibility = '17'
                      targetCompatibility = '17'
                  }
              }
          }
          EOF
          test -f "$GITHUB_WORKSPACE/logs-jvm-compat.gradle"

      - name: Build ArchIME Debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/logs"
          gradle --no-daemon -I "$GITHUB_WORKSPACE/logs-jvm-compat.gradle" -p "$GITHUB_WORKSPACE/ArchIME-0.7.2-dev" :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"

      - name: Verify APK contains real ARM64 Rime engine and Microsoft Shuangpin schema
        shell: bash
        run: |
          set -euo pipefail
          APK="ArchIME-0.7.2-dev/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee "$GITHUB_WORKSPACE/logs/apk-contents.txt"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libarchime_rime.so'
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/librime_jni.so'; then
            echo "Unexpected unused Trime JNI wrapper is packaged." >&2
            exit 1
          fi
          unzip -l "$APK" | grep -q 'assets/rime/shared/double_pinyin_mspy.schema.yaml'
          unzip -l "$APK" | grep -q 'assets/rime/shared/luna_pinyin.dict.yaml'
          unzip -l "$APK" | grep -q 'assets/rime/shared/stroke.dict.yaml'
          echo "APK contains ARM64 ArchIME Rime bridge and Microsoft Shuangpin source data."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArchIME-debug-apk
          path: ArchIME-0.7.2-dev/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ArchIME-build-log
          path: logs/**
          if-no-files-found: ignore
          retention-days: 7
